spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        same-site: lax

app:
  initial-admin:
    login-id: ${INITIAL_ADMIN_LOGIN_ID}
    password: ${INITIAL_ADMIN_PASSWORD}
    display-name: ${INITIAL_ADMIN_DISPLAY_NAME}

    security:
      login:
        max-failures: 5

      ip-restriction:
        enabled: true

