spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        same-site: lax

app:
  initial-admin:
    login-id: ${INITIAL_ADMIN_LOGIN_ID}
    password: ${INITIAL_ADMIN_PASSWORD}
    display-name: ${INITIAL_ADMIN_DISPLAY_NAME}

  security:
    login:
      max-failures: 5

    ip-restriction:
      enabled: true

  storage:
    s3:
      enabled: false
      bucket: ${AWS_STORAGE_BUCKET_NAME:}
      region: ${AWS_S3_REGION_NAME:ap-northeast-2}
      base-directory: ${S3_PREFIX:dev}/hotel-claim

  external:
    airtable:
      api-key: ${AIRTABLE_API_KEY}
      base-id: ${AIRTABLE_BASE_ID}
      table-id: ${AIRTABLE_TABLE_ID}
