spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${PROD_DB_URL}
    username: ${PROD_DB_USERNAME}
    password: ${PROD_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true

server:
  servlet:
    session:
      cookie:
        secure: true
        same-site: lax

app:
  storage:
    s3:
      bucket: ${AWS_S3_BUCKET}
      region: ${AWS_REGION}
      base-directory: ${AWS_S3_BASE_DIRECTORY:hotel-claim/prod}
